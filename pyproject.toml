[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blakezisserman"
version = "0.1.0"
description = "Blake-Zisserman variational approximation of signals, curves and images"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Your Name" }]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.12",      # cg(..., rtol=...) keyword
    "pydantic>=2",
    "numba>=0.58",
]

[project.optional-dependencies]
examples = ["matplotlib", "pooch"]   # pooch downloads scipy's sample image
test = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/blakezisserman"]
